# Checks every push and pull request. A `v*` tag also builds the release:
# an AppImage for Linux and a per-user Windows installer, signs the update
# manifests, uploads them to the update channel and creates a GitHub release.
#
# The workspace depends on the sibling checkouts ../schnellui and ../oximond,
# so every job checks out all three side by side:
#
#     $GITHUB_WORKSPACE/scriptschnell-term
#     $GITHUB_WORKSPACE/schnellui
#     $GITHUB_WORKSPACE/oximond
#
# --- Update channel ---------------------------------------------------------
# https://update.scriptschnell.codefionn.eu/scriptschnell-term/<platform>/
#     manifest.json, manifest.json.sig   the newest release, signed
#     <version>/<files>                  every release's files
# Windows builds check the channel and replace their own files after the
# signature and every file's SHA3-256 check out (crates/cmdterm-update).
#
# --- Repository variables (Settings > Secrets and variables > Variables) ----
#   SCRIPTSCHNELL_RELEASE_KEY   public release key line, built into the app
#                               (`cmdterm-release keygen` prints it)
#
# --- Secrets ----------------------------------------------------------------
#   SCRIPTSCHNELL_RELEASE_SIGNING_KEY   secret release key (the keygen file)
#   UPDATE_RSYNC_URL    rsync URL of the channel directory, such as
#                       rsync://user@codefionn.eu/module/scriptschnell-term
#   RSYNC_PASSWORD      password of that rsync module
#   SIBLING_TOKEN       optional: read access to codefionn/schnellui and
#                       codefionn/oximond when they are private

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through its upload.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scriptschnell-term
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false
      - uses: ./scriptschnell-term/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_TOKEN }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mercurial pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scriptschnell-term

      # Only this workspace's crates: `--all` would also check the siblings
      - name: Format
        run: |
          packages=()
          for crate in crates/*/; do packages+=(-p "$(basename "$crate")"); done
          cargo fmt --check "${packages[@]}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The emulator and the environment crate have platform code of their own (the PTY
  # layer, sandboxes), so they build and test on macOS too.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: scriptschnell-term
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false
      - uses: ./scriptschnell-term/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_TOKEN }}

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scriptschnell-term

      - name: Clippy
        run: cargo clippy -p cmdterm-vt -p cmdterm-env --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p cmdterm-vt -p cmdterm-env --locked

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the tag with the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::set the SCRIPTSCHNELL_RELEASE_KEY repository variable"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  appimage:
    needs: [check, version]
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: scriptschnell-term
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SCRIPTSCHNELL_RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false
      - uses: ./scriptschnell-term/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_TOKEN }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev file

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scriptschnell-term
          key: release

      - name: Build
        run: >-
          cargo build --release --locked
          --bin scriptschnell-term --bin cmdterm-remote --bin cmdterm-proxy-bridge

      - name: Install appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Pack the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/linux-x86_64/$VERSION"
          mkdir -p "$out"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/build-appimage.sh \
            target/release "$VERSION" "$out/scriptschnell-term-$VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux-x86_64
          if-no-files-found: error

  windows:
    needs: [check, version]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: scriptschnell-term
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SCRIPTSCHNELL_RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false
      - uses: ./scriptschnell-term/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_TOKEN }}

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scriptschnell-term
          key: release

      - name: PTY tests
        run: cargo test -p cmdterm-env --test pty --locked

      - name: Build
        run: cargo build --release --locked --bin scriptschnell-term --bin cmdterm-sandbox

      # The version directory holds exactly the files the updater installs
      # next to scriptschnell-term.exe.
      - name: Collect the files
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/windows-x86_64/$VERSION"
          mkdir -p "$out"
          cp target/release/scriptschnell-term.exe target/release/cmdterm-sandbox.exe "$out/"

      # A per-user installer into %LOCALAPPDATA%\Programs, where the updater
      # can replace files without admin rights.
      - name: Build the installer
        run: |
          set -euo pipefail
          find_iscc() {
            ls "/c/Program Files"*/"Inno Setup "*/ISCC.exe \
              "$(cygpath -u "$LOCALAPPDATA")"/Programs/"Inno Setup "*/ISCC.exe 2>/dev/null | head -n 1 || true
          }
          iscc="$(find_iscc)"
          if [ -z "$iscc" ]; then
            choco install innosetup --yes --no-progress
            iscc="$(find_iscc)"
          fi
          # Git Bash would turn the /D options into paths.
          MSYS_NO_PATHCONV=1 "$iscc" \
            "/DVersion=$VERSION" \
            "/DSourceDir=$(cygpath -w "$GITHUB_WORKSPACE/dist/windows-x86_64/$VERSION")" \
            "/DOutputDir=$(cygpath -w "$GITHUB_WORKSPACE/dist/downloads")" \
            packaging/windows/scriptschnell-term.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist
          if-no-files-found: error

  publish:
    needs: [version, appimage, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: scriptschnell-term
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false
      - uses: ./scriptschnell-term/.github/actions/checkout-siblings
        with:
          token: ${{ secrets.SIBLING_TOKEN }}

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scriptschnell-term
          key: publish

      - name: Build cmdterm-release
        run: cargo build --release --locked -p cmdterm-update --bin cmdterm-release

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      # `verify` checks the signature with the key the builds carry, so a
      # signing key that does not match it fails here, not on users' machines.
      - name: Sign the update manifests
        env:
          SCRIPTSCHNELL_RELEASE_SIGNING_KEY: ${{ secrets.SCRIPTSCHNELL_RELEASE_SIGNING_KEY }}
          RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64; do
            target/release/cmdterm-release sign \
              --version "$VERSION" --platform "$platform" "$GITHUB_WORKSPACE/dist/$platform"
            target/release/cmdterm-release verify \
              --public-key "$RELEASE_KEY" "$GITHUB_WORKSPACE/dist/$platform"
          done

      # Files first, manifests last, so a client never sees a manifest whose
      # files are not there yet.
      - name: Upload to the update channel
        env:
          UPDATE_RSYNC_URL: ${{ secrets.UPDATE_RSYNC_URL }}
          RSYNC_PASSWORD: ${{ secrets.RSYNC_PASSWORD }}
        working-directory: dist
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_RSYNC_URL:-}" ] || [ -z "${RSYNC_PASSWORD:-}" ]; then
            echo "::error::set the UPDATE_RSYNC_URL and RSYNC_PASSWORD secrets"
            exit 1
          fi
          rsync -rv --exclude 'manifest.json*' \
            windows-x86_64 linux-x86_64 downloads "$UPDATE_RSYNC_URL/"
          rsync -rv --include '*/' --include 'manifest.json*' --exclude '*' \
            windows-x86_64 linux-x86_64 "$UPDATE_RSYNC_URL/"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64; do
            cp "$platform/manifest.json" "manifest-$platform.json"
            cp "$platform/manifest.json.sig" "manifest-$platform.json.sig"
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            linux-x86_64/"$VERSION"/*.AppImage \
            downloads/*-setup.exe \
            manifest-*.json manifest-*.json.sig
