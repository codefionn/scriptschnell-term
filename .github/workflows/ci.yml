# Checks every push and pull request. A `v*` tag also builds the release:
# the AppImage for Linux with its signed update manifest, and the Windows
# programs, unsigned, as the `windows-x86_64-unsigned` artifact. It leaves the
# GitHub release as a draft. packaging/windows/sign-release.sh signs the
# Windows programs with Certum on a Linux machine, builds the installer from
# them and starts release-windows.yml, which checks the signatures, signs the
# Windows update manifest and publishes the release.
#
# --- Releases ---------------------------------------------------------------
# https://github.com/<repo>/releases/latest/download/manifest-<platform>.json
#     and .json.sig: the newest release, signed
# https://github.com/<repo>/releases/download/v<version>/<platform>-<file>
# https://releases.codefionn.eu/scriptschnell-term/ mirrors the same paths; the
# server pulls them (../infra-infrazeug). Windows installs and AppImages
# replace their own files after the signature and every file's SHA3-256 check
# out; other copies only notify (crates/cmdterm-update).
#
# --- Repository variables (Settings > Secrets and variables > Variables) ----
#   SCRIPTSCHNELL_RELEASE_KEY   public release key line, built into the app
#                               (`scriptschnell-term-release keygen` prints it)
#   WINDOWS_SIGNING_THUMBPRINTS SHA-1 thumbprints of the code signing
#                               certificates release-windows.yml accepts
#
# --- Secrets ----------------------------------------------------------------
#   SCRIPTSCHNELL_RELEASE_SIGNING_KEY   secret release key (the keygen file)

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through its upload.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Terminals run in a bubblewrap sandbox by default. Ubuntu 24.04 lets
      # only programs with an AppArmor profile create user namespaces, which
      # bwrap needs, so the restriction is lifted for the tests.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mercurial bubblewrap pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The emulator and the environment crate have platform code of their own (the PTY
  # layer, sandboxes), so they build and test on macOS too. Turned off for now; remove
  # the `if: false` to run it again.
  macos:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p cmdterm-vt -p cmdterm-env --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p cmdterm-vt -p cmdterm-env --locked

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare the tag with the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
          THUMBPRINTS: ${{ vars.WINDOWS_SIGNING_THUMBPRINTS }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::set the SCRIPTSCHNELL_RELEASE_KEY repository variable"
            exit 1
          fi
          if [ -z "$THUMBPRINTS" ]; then
            echo "::error::set the WINDOWS_SIGNING_THUMBPRINTS repository variable"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  appimage:
    needs: [check, version]
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SCRIPTSCHNELL_RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
      SCRIPTSCHNELL_RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev file

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build
        run: >-
          cargo build --release --locked
          --bin scriptschnell-term --bin scriptschnell-term-remote --bin scriptschnell-term-proxy-bridge

      - name: Install appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      # The updater renames a downloaded AppImage over the running one, so its
      # name carries no version: it stays right after an update.
      - name: Pack the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/linux-x86_64"
          mkdir -p "$out"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/build-appimage.sh \
            target/release "$VERSION" "$out/scriptschnell-term.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/linux-x86_64
          if-no-files-found: error

  windows:
    needs: [check, version]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SCRIPTSCHNELL_RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
      SCRIPTSCHNELL_RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Paths, quoting, ConPTY and the sandbox differ on Windows, so the
      # whole workspace is checked and tested here too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every failing test at once: a tag is the only run that gets here.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build
        run: cargo build --release --locked --bin scriptschnell-term --bin scriptschnell-term-sandbox

      # This directory holds exactly the files the updater installs next to
      # scriptschnell-term.exe.
      - name: Collect the files
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/windows-x86_64"
          mkdir -p "$out"
          cp target/release/scriptschnell-term.exe target/release/scriptschnell-term-sandbox.exe "$out/"

      # The released installer is built by sign-release.sh from the signed
      # programs. This build only finds a broken installer script at tag time.
      - name: Check that the installer builds
        run: |
          set -euo pipefail
          find_iscc() {
            ls "/c/Program Files"*/"Inno Setup "*/ISCC.exe \
              "$(cygpath -u "$LOCALAPPDATA")"/Programs/"Inno Setup "*/ISCC.exe 2>/dev/null | head -n 1 || true
          }
          iscc="$(find_iscc)"
          if [ -z "$iscc" ]; then
            choco install innosetup --yes --no-progress
            iscc="$(find_iscc)"
          fi
          # Git Bash would turn the /D options into paths.
          MSYS_NO_PATHCONV=1 "$iscc" \
            "/DVersion=$VERSION" \
            "/DSourceDir=$(cygpath -w "$GITHUB_WORKSPACE/dist/windows-x86_64")" \
            "/DOutputDir=$(cygpath -w "$RUNNER_TEMP/installer")" \
            packaging/windows/scriptschnell-term.iss

      # sign-release.sh signs these, and release-windows.yml checks that the
      # signed copies are these programs with only a signature added.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-unsigned
          path: dist/windows-x86_64
          if-no-files-found: error

  draft:
    needs: [version, appimage, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Build scriptschnell-term-release
        run: cargo build --release --locked -p cmdterm-update --bin scriptschnell-term-release

      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: dist/linux-x86_64

      # `sign` copies the files into dist/assets under their asset names.
      # `verify` checks the signature with the key the builds carry, so a
      # signing key that does not match it fails here, not on users' machines.
      # release-windows.yml signs the Windows manifest.
      - name: Sign the Linux update manifest
        env:
          SCRIPTSCHNELL_RELEASE_SIGNING_KEY: ${{ secrets.SCRIPTSCHNELL_RELEASE_SIGNING_KEY }}
          RELEASE_KEY: ${{ vars.SCRIPTSCHNELL_RELEASE_KEY }}
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/dist/assets"
          target/release/scriptschnell-term-release sign --version "$VERSION" --platform linux-x86_64 \
            --out "$assets" "$GITHUB_WORKSPACE/dist/linux-x86_64"
          target/release/scriptschnell-term-release verify \
            --public-key "$RELEASE_KEY" --platform linux-x86_64 "$assets"

      # A draft: `releases/latest` and the mirror only see the release once
      # release-windows.yml added the Windows files and published it, so
      # nobody gets a manifest without its files.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist/assets
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --draft ./*
