name: Check out the sibling checkouts
description: >-
  Checks out schnellui and oximond next to the scriptschnell-term checkout,
  where the workspace's path dependencies expect them.

inputs:
  token:
    description: Token with read access to both repositories.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out schnellui
      uses: actions/checkout@v4
      with:
        repository: codefionn/schnellui
        path: schnellui
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Check out oximond
      uses: actions/checkout@v4
      with:
        repository: codefionn/oximond
        path: oximond
        token: ${{ inputs.token || github.token }}
        persist-credentials: false
