[package]
name = "cmdterm-update"
description = "Signed release manifests and self-updates for scriptschnell-term"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriptschnell-term-release"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sha3 = "0.11.0"
thiserror.workspace = true
ureq.workspace = true
zeroize = "1.8.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
