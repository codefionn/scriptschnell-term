[package]
name = "cmdterm-remote"
description = "Remote machines for cmdterm: post-quantum authenticated server, client and Firecracker VMs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriptschnell-term-remote"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.7", features = ["derive"] }
cmdterm-env.workspace = true
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
nix = { version = "0.29.0", features = ["socket", "signal", "process"] }
rustix = { version = "1.1.5", features = ["net", "process", "stdio", "termios", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sha3 = "0.11.0"
signal-hook = "0.3.18"
ureq.workspace = true
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
