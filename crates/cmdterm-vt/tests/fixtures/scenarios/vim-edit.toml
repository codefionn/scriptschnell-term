# vim -u NONE: open a fixed file, scroll, split, insert wide and combining
# characters, then quit. Uses the alternate screen, scroll regions and many cursor moves.
command = "vim"
args = ["-u", "NONE", "-i", "NONE", "-n", "--noplugin", "-c", "set nocompatible laststatus=2 ruler number", "lines.txt"]
rows = 20
cols = 60

[files]
"lines.txt" = "line 01\nline 02\nline 03\nline 04\nline 05\nline 06\nline 07\nline 08\nline 09\nline 10\nline 11\nline 12\nline 13\nline 14\nline 15\nline 16\nline 17\nline 18\nline 19\nline 20\nline 21\nline 22\nline 23\nline 24\nline 25\nline 26\nline 27\nline 28\nline 29\nline 30\n"

[[step]]
wait_quiet_ms = 500
[[step]]
send = "\u0006"
[[step]]
wait_quiet_ms = 200
[[step]]
send = "\u0002"
[[step]]
wait_quiet_ms = 200
[[step]]
send = ":split\r"
[[step]]
wait_quiet_ms = 300
[[step]]
send = "Gi\u0001\u0002 é 你好 😀\u001b"
[[step]]
wait_quiet_ms = 300
[[step]]
send = "ggOtop\u001b"
[[step]]
wait_quiet_ms = 300
[[step]]
send = ":vsplit\r"
[[step]]
wait_quiet_ms = 300
[[step]]
send = "G"
[[step]]
wait_quiet_ms = 300
[[step]]
stop = true
