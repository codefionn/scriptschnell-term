# less on a long file: paging, search with highlight, jumping and quitting. less
# switches to the alternate screen and scrolls with reverse index and line feeds.
command = "less"
args = ["-N", "-+F", "-+X", "long.txt"]
rows = 16
cols = 50

[files]
"long.txt" = "alpha one\nbeta two\ngamma three\ndelta four\nepsilon five\nzeta six\neta seven\ntheta eight\niota nine\nkappa ten\nlambda eleven\nmu twelve\nnu thirteen\nxi fourteen\nomicron fifteen\npi sixteen\nrho seventeen\nsigma eighteen\ntau nineteen\nupsilon twenty\nphi 21 alpha\nchi 22\npsi 23\nomega 24 alpha\nlast 25\n"

[[step]]
wait_quiet_ms = 300
[[step]]
send = " "
[[step]]
wait_quiet_ms = 200
[[step]]
send = "/alpha\r"
[[step]]
wait_quiet_ms = 200
[[step]]
send = "n"
[[step]]
wait_quiet_ms = 200
[[step]]
send = "b"
[[step]]
wait_quiet_ms = 200
[[step]]
send = "5G"
[[step]]
wait_quiet_ms = 200
[[step]]
stop = true
