args = ["build", "--offline", "--color=always"]
program = "cargo"
program_version = "cargo 1.97.1 (c980f4866 2026-06-30)"
recorded_at = "2026-11-01"
tool_version = "cmdterm-vt record 0.1.0"

[env]
LANG = "C.UTF-8"
PATH = "/usr/local/bin:/usr/bin:/bin"
PS1 = "$ "
TERM = "xterm-256color"
cleared = true
host_paths = ["RUSTUP_HOME=~/.rustup"]
overrides = ["CARGO_HOME=/tmp/cmdterm-vt-record-cargo-error/cargo-state", "CARGO_TERM_COLOR=always", "CARGO_TERM_PROGRESS_WHEN=always", "CARGO_TERM_PROGRESS_WIDTH=60"]
scratch_dirs = ["HOME", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_CACHE_HOME", "XDG_STATE_HOME"]

[size]
cols = 100
rows = 30
