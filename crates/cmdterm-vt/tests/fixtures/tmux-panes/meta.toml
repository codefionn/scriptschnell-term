args = ["-f", "tmux.conf", "-L", "cmdterm-vt-record", "new-session", "-s", "demo"]
program = "tmux"
program_version = "tmux 3.8"
recorded_at = "2026-11-01"
tool_version = "cmdterm-vt record 0.1.0"

[env]
LANG = "C.UTF-8"
PATH = "/usr/local/bin:/usr/bin:/bin"
PS1 = "$ "
TERM = "xterm-256color"
cleared = true
host_paths = []
overrides = ["HISTFILE=/dev/null", "SHELL=/bin/bash", "TMUX_TMPDIR=/tmp"]
scratch_dirs = ["HOME", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_CACHE_HOME", "XDG_STATE_HOME"]

[size]
cols = 60
rows = 20
