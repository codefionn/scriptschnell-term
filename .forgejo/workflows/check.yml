# Checks formatting, lints and runs the workspace tests on every push and pull
# request.
#
# --- Runner requirements -----------------------------------------------------
# Jobs run on a forgejo-runner label `docker`. Tests that need bubblewrap
# namespaces or podman skip themselves when the container cannot provide them.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: docker
    container:
      image: rust:1.97.1-trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install job prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs git mercurial pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
