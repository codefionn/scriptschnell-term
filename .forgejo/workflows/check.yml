# Checks formatting, lints and runs the workspace tests on every push and pull
# request.
#
# The workspace depends on the sibling checkouts ../schnellui and ../oximond,
# so this job checks out all three side by side, the siblings at their default
# branches:
#
#     $GITHUB_WORKSPACE/scriptschnell-term
#     $GITHUB_WORKSPACE/schnellui
#     $GITHUB_WORKSPACE/oximond
#
# --- Runner requirements -----------------------------------------------------
# Jobs run on a forgejo-runner label `docker`. Tests that need bubblewrap
# namespaces or podman skip themselves when the container cannot provide them.
#
# --- Optional secrets (repo/org Settings > Actions > Secrets) -----------------
#   SIBLING_TOKEN   token with read access to codefionn/schnellui and
#                   codefionn/oximond. The job token only reads this
#                   repository, so set it when the siblings are private.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: docker
    container:
      image: rust:1.97.1-trixie
    defaults:
      run:
        shell: bash
        working-directory: scriptschnell-term
    steps:
      - name: Install job prerequisites
        working-directory: .
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs git mercurial pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          path: scriptschnell-term
          persist-credentials: false

      - name: Check out schnellui
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          repository: codefionn/schnellui
          path: schnellui
          token: ${{ secrets.SIBLING_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out oximond
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          repository: codefionn/oximond
          path: oximond
          token: ${{ secrets.SIBLING_TOKEN || github.token }}
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Only this workspace's crates: `--all` would also check the siblings
      - name: Format
        run: |
          set -euo pipefail
          packages=()
          for crate in crates/*/; do packages+=(-p "$(basename "$crate")"); done
          cargo fmt --check "${packages[@]}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
