title = "Toolchains"
description = "Supports language toolchains and global tools in sandboxed terminals, including rustup, nvm, fnm, volta, npx, pnpm, bun, deno, pyenv, uv, go, dotnet tools, mise, asdf, and sdkman."
permissions = ["env", "sandbox"]

[[settings]]
key = "off"
title = "Disabled tools"
description = "Tools whose directories stay read-only and whose hosts are not allowed: rustup, cargo, nvm, fnm, volta, npm, pnpm, yarn, bun, deno, pyenv, uv, pipx, go, dotnet, mise, asdf, sdkman, rbenv, gem."
type = "list"

[[settings]]
key = "writable"
title = "Additional writable paths"
description = "Extra directories sandboxes may write to, such as a tool home directory not listed above. Paths may start with ~/."
type = "list"
