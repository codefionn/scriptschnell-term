title = "Claude Code"
description = "Sets up Claude Code in devcontainers, VMs, and remote machines by copying settings and login credentials and installing the CLI."
permissions = ["env", "filesystem", "copy", "run"]

[[settings]]
key = "kinds"
title = "Environments"
description = "Environment types to set up when they start: devcontainer, vm, remote, ssh."
type = "list"
default = ["devcontainer", "vm", "remote"]

[[settings]]
key = "copy"
title = "Files in ~/.claude to copy"
description = "Missing files are skipped."
type = "list"
default = ["settings.json", "CLAUDE.md", "agents", "commands", "skills", "hooks", "output-styles", "plugins"]

[[settings]]
key = "credentials"
title = "Copy login credentials"
description = "Copies ~/.claude/.credentials.json, granting the environment access to your Claude account."
type = "bool"
default = false

[[settings]]
key = "install"
title = "Install Claude Code"
description = "Runs the official install script when claude is not installed."
type = "bool"
default = true
