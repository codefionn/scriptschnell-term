title = "Blocklist"
description = "Blocks ad, tracker, and malware hosts in sandboxes using HaGeZi's DNS blocklist, cached for a week."
permissions = ["sandbox", "network"]
# Where the HaGeZi lists come from. The hosts of "More lists" are allowed as well.
hosts = ["raw.githubusercontent.com", "codeberg.org"]

[[settings]]
key = "list"
title = "List"
description = "Which HaGeZi list to use: light, multi (normal), pro, pro.plus, and ultimate block progressively more; tif covers threat intelligence only. Set to off to disable."
type = "choice"
choices = ["pro", "light", "multi", "pro.plus", "ultimate", "tif", "off"]

[[settings]]
key = "max_age_days"
title = "Refresh interval (days)"
description = "Days before the cached blocklist is downloaded again."
type = "integer"
default = 7

[[settings]]
key = "urls"
title = "More lists"
description = "Additional https:// blocklist URLs (plain domains, hosts files, or Adblock domain rules)."
type = "urls"

[[settings]]
key = "blocked"
title = "Blocked hosts"
description = "Additional hosts to block. A domain also blocks its subdomains; *.example.com blocks subdomains only."
type = "list"

[[settings]]
key = "unblocked"
title = "Never blocked"
description = "Hosts exempted from all blocklists, using the same format."
type = "list"
